[workspace]
resolver = "3"
members = ["crates/core", "crates/extd", "crates/ui"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"

# Single-sourced versions. Every crate below picks features explicitly;
# nothing here is allowed to arrive with default features by accident.
[workspace.dependencies]
extboard-core = { path = "crates/core" }

serde      = { version = "1", default-features = false, features = ["derive", "std"] }
# preserve_order stays OFF: sorted BTreeMap output is what makes a one-node
# change a one-line git diff. Turning it on silently breaks that.
serde_json = { version = "1", default-features = false, features = ["std"] }
blake3     = { version = "1", default-features = false, features = ["std"] }
thiserror  = "2"
clap       = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
tokio      = { version = "1.53.1", default-features = false, features = ["sync", "rt", "rt-multi-thread", "macros", "net", "signal"] }
# http1 only: nothing reaches us except over loopback and Tailscale's proxy,
# and h2 would buy nothing for a single client.
axum       = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
# Test-only: `oneshot` drives the Router without binding a socket.
tower      = { version = "0.5", default-features = false, features = ["util"] }

# Native release: fast, small-ish, reproducible.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
# panic stays "unwind" here on purpose: a panicking request handler in extd
# should kill the task, not the process holding the spaces directory.

# The wasm bundle is the only artifact where bytes beat cycles.
# Build with: cargo build --profile wasm-release --target wasm32-unknown-unknown
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
panic = "abort"

# Bevy is unusable in a debug build unless its deps are optimised.
[profile.dev.package."*"]
opt-level = 3
