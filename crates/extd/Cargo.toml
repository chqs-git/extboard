[package]
name = "extd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# tower is dev-only — `oneshot` drives the Router in tests without a socket.
[dependencies]
extboard-core.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
axum.workspace = true
tokio-stream.workspace = true
notify.workspace = true
tower-http.workspace = true
# `html` is not in the default set; the ui crate takes the same version with
# `simd`, and cargo unifies them into one build.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[dev-dependencies]
tower.workspace = true
