[package]
name = "extboard-ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
extboard-core.workspace = true
serde_json.workspace = true
# The one HTTP client for both targets: non-blocking on native and wasm, so
# client.rs gets written once instead of twice.
ehttp = { version = "0.7", features = ["streaming"] }
# Node markdown (E3-T6).
pulldown-cmark = { version = "0.13", default-features = false, features = ["simd"] }
# Board scripts (E6-T4). `sync` is what lets the engine live in a resource;
# `no_module` drops `import` and with it the file-backed module resolver, which
# is the one way stock Rhai reaches outside the document.
rhai = { version = "1", default-features = false, features = ["std", "sync", "no_module", "no_time", "no_custom_syntax"] }
# `now()` for E6-T8. Rhai is built with `no_time`, and a local clock is not a
# few lines of our own: `clock` is the system timezone, `wasmbind` is the same
# answer out of the browser's `Date`, and both have to agree about DST.
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }

# No defaults. The `2d`/`ui` bundles pull gilrs, audio, sysinfo and the whole
# 3D pipeline; this list is the other direction — add a feature when something
# is missing, never trim from defaults.
bevy = { version = "0.19", default-features = false, features = [
  "std",
  "async_executor",
  "bevy_asset",
  "bevy_log",
  # window + event loop
  "bevy_window",
  "bevy_winit",
  "keyboard",
  "mouse",
  # 2D render path
  "bevy_render",
  # E8-T4's image nodes, over `is_image`'s list minus svg and avif, which only
  # the phone view's browser decodes.
  "png",
  "jpeg",
  "webp",
  "gif",
  "bevy_core_pipeline",
  "bevy_sprite",
  "bevy_sprite_render",
  # E3-T5 draws edges in immediate mode; no meshes, no entities
  "bevy_gizmos",
  "bevy_gizmos_render",
  # text: system_font_discovery or FontSource::Monospace renders nothing (E3-T1)
  "bevy_text",
  "default_font",
  "system_font_discovery",
  # bevy_ui for the panels; system_clipboard is E5-T5's copy/paste
  "bevy_ui",
  "bevy_ui_render",
  "system_clipboard",
  # E5-T5 edits text with bevy_ui_widgets' EditableText, which DefaultPlugins
  # wires up (input focus included). Picking is how a click lands the caret and
  # a drag selects: without it the editor is keyboard-only.
  "bevy_ui_widgets",
  "bevy_picking",
  "ui_picking",
  # linux: add "x11", "wayland" — no window without them
] }

# Cargo unions features per dependency across target sections, so these add to
# the list above rather than replacing it. A wasm tab gets no threads without
# cross-origin isolation, so multi_threaded is dead bytes there.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
# `clipboard_image` is native-only on purpose: bevy_clipboard's `fetch_image`
# reads an `arboard` handle, and arboard is not built for wasm -- the tab reads a
# pasted image off its own `paste` event instead. See edit/drop.rs.
bevy = { version = "0.19", default-features = false, features = [
  "multi_threaded",
  "clipboard_image",
  # Images from a remote extd: `asset_path` hands the asset server an
  # `http(s)://` path and these are the readers for it. A tab needs neither --
  # there the spaces dir is same-origin already.
  "http",
  "https",
] }
# The PNG encoder for a pasted screenshot: arboard hands over raw RGBA and the
# spaces dir holds files. Already in the tree under `bevy_image`, so this
# declares what is there rather than adding anything.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_family = "wasm")'.dependencies]
bevy = { version = "0.19", default-features = false, features = ["webgl2"] }
# All three are already in the tree under bevy. The features are what reads
# `/s/{id}` back out of the URL extd served the page under, and what reads a
# dropped file: winit hands a browser drop a name with no bytes behind it.
web-sys = { version = "0.3", features = [
  "Window",
  "Location",
  "Document",
  "EventTarget",
  "MouseEvent",
  "DragEvent",
  "DataTransfer",
  "FileList",
  "File",
  "ClipboardEvent",
  "Blob",
  "FileReader",
] }
wasm-bindgen = "0.2"
js-sys = "0.3"

# Test-only: the polygon shader is text until a GPU sees it, and a typo in it
# is a blank board rather than a build error. `naga` is already in the tree
# under wgpu; this parses and type-checks the same WGSL at `cargo test`.
[dev-dependencies]
naga = { version = "29", default-features = false, features = ["wgsl-in"] }

# `bevy run --features dev`. dynamic_linking is the whole point (link time);
# the rest is the inspector/hot-reload kit. Never enabled in release.
[features]
dev = ["bevy/dynamic_linking", "bevy/bevy_dev_tools", "bevy/file_watcher", "bevy/debug"]
