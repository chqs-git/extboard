<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ext.board</title>
<!-- wasm-bindgen drops the target_features section, so wasm-opt falls back to
     MVP and rejects rustc's bulk-memory ops. These six are exactly what
     `rustc --target wasm32-unknown-unknown --print cfg` reports. -->
<link data-trunk rel="rust" data-bin="extboard-ui" data-wasm-opt="z"
      data-wasm-opt-params="--strip-debug --enable-bulk-memory --enable-bulk-memory-opt --enable-multivalue --enable-mutable-globals --enable-nontrapping-float-to-int --enable-reference-types --enable-sign-ext" />
<style>
  html, body { margin: 0; height: 100%; background: #12121a; overflow: hidden; }
  /* The size is `fit_canvas_to_parent`'s, written inline on the canvas; `block`
     is still ours, or the inline baseline leaves a gap under it. */
  /* `touch-action` and not `user-scalable=no`, which Safari ignores. */
  canvas { display: block; touch-action: none; }
  /* client.rs's prompt for a locked space, over the board. */
  #lock { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 12px;
          align-items: center; justify-content: center; background: #1a1b26;
          color: #dbe0eb; font: 14px system-ui, sans-serif; }
  #lock input { width: 220px; padding: 6px 8px; font-size: 16px; color: inherit;
                background: #292b36; border: 2px solid #40444f; border-radius: 8px; outline: none; }
  #lock input:focus { border-color: #73808c; }
  #lock a { color: #73808c; }
</style>
</head>
<body></body>
</html>
